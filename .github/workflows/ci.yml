name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOWORK: "off"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -short -race ./...

  # Every engine runs the shared conformance suite against a real database
  # started by testcontainers-go.
  conformance:
    runs-on: ubuntu-latest
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        engine: [postgres, mariadb, mongo, valkey]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -race -timeout 20m -coverpkg=./internal/... -coverprofile=coverage-${{ matrix.engine }}.out ./internal/engines/${{ matrix.engine }}/...
      - uses: actions/upload-artifact@v5
        with:
          name: coverage-${{ matrix.engine }}
          path: coverage-${{ matrix.engine }}.out

  bench:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -short -run '^$' -bench . -benchmem ./... | tee bench.txt
      - uses: actions/upload-artifact@v5
        with:
          name: go-bench
          path: bench.txt

  # Cross-compiled binaries of every service (linux, darwin, windows x amd64,
  # arm64). Pushes to main refresh the "edge" prerelease, v* tags publish a
  # versioned release.
  goreleaser:
    runs-on: ubuntu-latest
    needs: [lint, unit]
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: ${{ startsWith(github.ref, 'refs/tags/v') && 'release --clean' || 'release --snapshot --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: publish edge prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete edge --cleanup-tag --yes || true
          gh release create edge dist/*.tar.gz dist/*.zip dist/checksums.txt \
            --prerelease --target "$GITHUB_SHA" \
            --title "edge (${GITHUB_SHA::7})" \
            --notes "Binaries built from main at ${GITHUB_SHA}. Versioned releases are tagged v*."
      - uses: actions/upload-artifact@v5
        with:
          name: binaries
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  images:
    runs-on: ubuntu-latest
    needs: [lint, unit]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [bench-runner, store-postgres, store-mariadb, store-mongo, store-valkey]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ticketbench-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SERVICE=${{ matrix.service }}
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
